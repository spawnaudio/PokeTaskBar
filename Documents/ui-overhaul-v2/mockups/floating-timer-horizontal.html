<style>
  #ptb-thin-timer { --ptb-height:48px; --ptb-pet-size:80px; display:grid; gap:12px; width:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; line-height:1.3; }
  #ptb-thin-timer * { box-sizing:border-box; }
  #ptb-thin-timer .ptb-desktop { position:relative; min-width:0; height:194px; border-radius:12px; overflow:hidden; background:var(--ptb-desktop); color:var(--ptb-text); }
  #ptb-thin-timer [data-appearance="dark"] { color-scheme:dark; --ptb-desktop:#17181b; --ptb-panel:#1f2023; --ptb-border:#383a40; --ptb-control:#303138; --ptb-text:#f1f1f3; --ptb-secondary:#a2a4ad; --ptb-accent:#35c2d7; --ptb-shadow:0 10px 28px #0005,0 2px 5px #0003; }
  #ptb-thin-timer [data-appearance="light"] { color-scheme:light; --ptb-desktop:#f3f4f6; --ptb-panel:#fff; --ptb-border:#dde0e6; --ptb-control:#e7e9ee; --ptb-text:#202126; --ptb-secondary:#60636c; --ptb-accent:#086c7d; --ptb-shadow:0 10px 28px #17181b12,0 2px 5px #17181b0d; }
  #ptb-thin-timer .ptb-theme-label { position:absolute; left:18px; top:16px; font-size:12px; font-weight:500; color:var(--ptb-secondary); }
  #ptb-thin-timer .ptb-floating { position:absolute; left:24px; top:58px; display:flex; align-items:center; gap:10px; user-select:none; -webkit-user-select:none; }
  #ptb-thin-timer .ptb-strip { position:relative; display:flex; align-items:center; gap:10px; flex-shrink:0; width:424px; height:var(--ptb-height); padding:0 6px 0 4px; background:var(--ptb-panel); border:1px solid var(--ptb-border); border-radius:9px; box-shadow:var(--ptb-shadow); }
  #ptb-thin-timer button { font:inherit; color:inherit; appearance:none; margin:0; padding:0; border:0; background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
  #ptb-thin-timer button:disabled { opacity:.4; cursor:default; }
  #ptb-thin-timer button svg { width:15px; height:15px; stroke-width:1.6; }
  #ptb-thin-timer .ptb-grip { height:32px; width:17px; color:var(--ptb-secondary); opacity:.5; cursor:grab; touch-action:none; }
  #ptb-thin-timer .ptb-grip svg { width:14px; height:16px; }
  #ptb-thin-timer .ptb-clock { width:66px; flex-shrink:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:20px; font-weight:500; letter-spacing:-1px; line-height:1; font-variant-numeric:tabular-nums; }
  #ptb-thin-timer .ptb-divider { width:1px; height:19px; flex-shrink:0; background:var(--ptb-border); }
  #ptb-thin-timer .ptb-task { display:flex; align-items:center; gap:8px; min-width:0; flex:1; white-space:nowrap; overflow:hidden; }
  #ptb-thin-timer .ptb-issue { font-size:11px; color:var(--ptb-secondary); flex-shrink:0; }
  #ptb-thin-timer .ptb-title { font-size:12px; overflow:hidden; text-overflow:ellipsis; }
  #ptb-thin-timer .ptb-actions { display:flex; gap:3px; width:0; opacity:0; overflow:hidden; pointer-events:none; transition:width 140ms ease,opacity 140ms ease; flex-shrink:0; }
  #ptb-thin-timer .ptb-action { border-radius:5px; width:28px; height:28px; color:var(--ptb-secondary); }
  #ptb-thin-timer .ptb-action:hover { color:var(--ptb-text); background:var(--ptb-control); }
  #ptb-thin-timer .ptb-add { font-size:11px; font-weight:500; font-variant-numeric:tabular-nums; }
  #ptb-thin-timer .ptb-resize { height:34px; width:9px; cursor:ew-resize; touch-action:none; }
  #ptb-thin-timer .ptb-resize span { width:2px; height:18px; border-radius:1px; background:var(--ptb-border); }
  #ptb-thin-timer .ptb-strip:is(:hover,:focus-within,[data-dragging]) .ptb-actions { width:90px; opacity:1; pointer-events:auto; }
  #ptb-thin-timer .ptb-strip:is(:hover,:focus-within,[data-dragging]) .ptb-grip { opacity:1; }
  #ptb-thin-timer .ptb-resize:is(:hover,:focus-visible) span,#ptb-thin-timer .ptb-strip[data-dragging="resize"] .ptb-resize span { background:var(--ptb-accent); }
  #ptb-thin-timer .ptb-strip[data-dragging="move"] .ptb-grip { cursor:grabbing; }
  #ptb-thin-timer .ptb-progress { position:absolute; bottom:0; left:9px; right:9px; height:2px; background:var(--ptb-border); border-radius:1px; overflow:hidden; }
  #ptb-thin-timer .ptb-progress span { display:block; width:51.4%; height:100%; background:var(--ptb-accent); }
  #ptb-thin-timer .ptb-pet { width:var(--ptb-pet-size); height:var(--ptb-pet-size); object-fit:contain; flex-shrink:0; image-rendering:pixelated; pointer-events:none; }
  #ptb-thin-timer .ptb-feedback { position:absolute; left:18px; bottom:14px; font-size:11px; color:var(--ptb-secondary); }
  #ptb-thin-timer .ptb-strip[data-paused="true"] .ptb-clock { color:var(--ptb-secondary); }
  @media (max-width:480px) {
    #ptb-thin-timer { --ptb-pet-size:56px; }
    #ptb-thin-timer .ptb-strip { gap:5px; }
    #ptb-thin-timer .ptb-floating { gap:6px; }
    #ptb-thin-timer .ptb-clock { font-size:18px; width:58px; }
    #ptb-thin-timer .ptb-divider { display:none; }
    #ptb-thin-timer .ptb-issue { display:none; }
    #ptb-thin-timer .ptb-action { width:25px; }
    #ptb-thin-timer .ptb-strip:is(:hover,:focus-within,[data-dragging]) .ptb-actions { width:81px; }
  }
  @media (pointer:coarse) {
    #ptb-thin-timer .ptb-desktop { height:208px; }
    #ptb-thin-timer .ptb-strip { min-height:48px; gap:0; padding:0; }
    #ptb-thin-timer .ptb-grip,#ptb-thin-timer .ptb-resize { width:44px; height:44px; }
    #ptb-thin-timer .ptb-task,#ptb-thin-timer .ptb-divider { display:none; }
    #ptb-thin-timer .ptb-actions,#ptb-thin-timer .ptb-strip:is(:hover,:focus-within,[data-dragging]) .ptb-actions { width:132px; opacity:1; pointer-events:auto; gap:0; }
    #ptb-thin-timer .ptb-action { width:44px; height:44px; }
    #ptb-thin-timer .ptb-floating { gap:0; }
    #ptb-thin-timer .ptb-pet { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { #ptb-thin-timer .ptb-actions { transition:none; } }
</style>
<script>
(() => {
  const root = document.getElementById('ptb-thin-timer');
  const design = {height:48};
  const desktops = [...root.querySelectorAll('.ptb-desktop')];
  const states = desktops.map(() => ({x:24,y:58,width:424,seconds:1458,paused:false,done:false}));
  const clamp = (value,min,max) => Math.min(Math.max(min,max),Math.max(min,value));
  function geometry(index) {
    const desktop = desktops[index];
    const group = desktop.querySelector('.ptb-floating');
    const pet = desktop.querySelector('.ptb-pet');
    const petWidth = pet.getBoundingClientRect().width;
    const gap = Number.parseFloat(getComputedStyle(group).gap) || 0;
    const reserve = petWidth + gap;
    const maxWidth = desktop.clientWidth - 24 - reserve;
    return {reserve,maxWidth,minWidth:Math.min(matchMedia('(pointer:coarse)').matches?288:212,maxWidth)};
  }
  function render(index) {
    const desktop = desktops[index];
    const state = states[index];
    const box = geometry(index);
    const width = clamp(state.width,box.minWidth,box.maxWidth);
    state.x = clamp(state.x,12,desktop.clientWidth-width-box.reserve-12);
    state.y = clamp(state.y,40,desktop.clientHeight-Math.max(design.height,desktop.querySelector('.ptb-pet').getBoundingClientRect().height)-30);
    const group = desktop.querySelector('.ptb-floating');
    group.style.left = state.x+'px'; group.style.top = state.y+'px';
    const strip = desktop.querySelector('.ptb-strip');
    strip.style.width = width+'px'; strip.dataset.paused = String(state.paused);
    desktop.querySelector('.ptb-clock').textContent = state.done?'Done':`${String(Math.floor(state.seconds/60)).padStart(2,'0')}:${String(state.seconds%60).padStart(2,'0')}`;
    desktop.querySelector('.ptb-title').textContent = state.done?'Session complete':'Refine the menu bar';
    desktop.querySelector('.ptb-progress span').style.width = (state.done?100:Math.max(0,100-state.seconds/3000*100))+'%';
    const pause = desktop.querySelector('[data-action="pause"]');
    const pauseLabel = state.paused?'Resume':'Pause';
    pause.setAttribute('aria-label',pauseLabel+' timer');
    pause.setAttribute('data-tooltip',pauseLabel);
    pause.setAttribute('aria-pressed',String(state.paused));
    if (pause.dataset.icon !== pauseLabel) {
      pause.innerHTML = `<i data-lucide="${state.paused?'play':'pause'}" aria-hidden="true"></i>`;
      pause.dataset.icon = pauseLabel;
      if (globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    }
    pause.disabled = state.done;
    desktop.querySelector('[data-action="add"]').disabled = state.done;
    desktop.querySelector('[data-action="done"]').disabled = state.done;
  }
  function renderAll() {root.style.setProperty('--ptb-height',design.height+'px'); states.forEach((_,i)=>render(i));}
  function restore(snapshot) {
    if (snapshot?.privateContent?.version !== 1) return;
    const saved = snapshot.privateContent.states;
    if (!Array.isArray(saved) || saved.length!==states.length) return;
    saved.forEach((state,i)=>{
      for (const key of ['x','y','width','seconds']) if(Number.isFinite(state[key])) states[i][key]=state[key];
      for (const key of ['paused','done']) if(typeof state[key]==='boolean') states[i][key]=state[key];
    });
    renderAll();
  }
  function save() {
    if (!window.openai?.setWidgetState) return;
    window.openai.setWidgetState({modelContent:{design:'Thin horizontal floating timer with hover controls',height:design.height,widths:desktops.map(d=>Math.round(d.querySelector('.ptb-strip').getBoundingClientRect().width))},privateContent:{version:1,states:states.map(s=>({...s}))}}).catch(()=>{});
  }
  desktops.forEach((desktop,index)=>{
    const state = states[index];
    const strip = desktop.querySelector('.ptb-strip');
    const feedback = desktop.querySelector('.ptb-feedback');
    desktop.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
      if (button.dataset.action==='pause') {state.paused=!state.paused; feedback.textContent=state.paused?'Paused':'Focus resumed';}
      if (button.dataset.action==='add') {state.seconds+=300; feedback.textContent='5 minutes added';}
      if (button.dataset.action==='done') {state.done=true; feedback.textContent='Session complete';}
      render(index); save();
    }));
    desktop.querySelectorAll('[data-gesture]').forEach(handle=>{
      let drag = null;
      handle.addEventListener('pointerdown',event=>{
        if(event.button!==0) return;
        const width = strip.getBoundingClientRect().width;
        drag={pointerId:event.pointerId,cx:event.clientX,cy:event.clientY,x:state.x,y:state.y,width};
        if(event.isTrusted) handle.setPointerCapture(event.pointerId);
        strip.dataset.dragging=handle.dataset.gesture;
        event.preventDefault();
      });
      handle.addEventListener('pointermove',event=>{
        if(!drag || event.pointerId!==drag.pointerId) return;
        if(handle.dataset.gesture==='move') {state.x=drag.x+event.clientX-drag.cx; state.y=drag.y+event.clientY-drag.cy;}
        else {const box=geometry(index); state.width=clamp(drag.width+event.clientX-drag.cx,box.minWidth,desktop.clientWidth-state.x-box.reserve-12);}
        render(index);
      });
      const finish=()=>{if(!drag)return; drag=null; delete strip.dataset.dragging;save();};
      handle.addEventListener('pointerup',finish);
      handle.addEventListener('pointercancel',finish);
      handle.addEventListener('lostpointercapture',finish);
      handle.addEventListener('keydown',event=>{
        const deltas={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]};
        const delta=deltas[event.key]; if(!delta)return;
        event.preventDefault();
        if(handle.dataset.gesture==='move'){state.x+=delta[0];state.y+=delta[1];}
        else {const box=geometry(index);state.width=clamp(strip.getBoundingClientRect().width+delta[0]*2,box.minWidth,desktop.clientWidth-state.x-box.reserve-12);}
        render(index);save();
      });
    });
  });
  renderAll();
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  new ResizeObserver(renderAll).observe(root);
  if (globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:renderAll});
    tweak.addSlider(design,'height',{label:'Strip height',min:40,max:56,step:2,unit:'px'});
  }
})();
</script>
